# nfpm config for the cara-agent package (CARA-143). Built by
# scripts/release/package.sh, which sets CARA_VERSION and CARA_ARCH and runs nfpm
# in a staging directory holding packaging/ and the binaries under bin/.
name: cara-agent
arch: ${CARA_ARCH}
platform: linux
version: ${CARA_VERSION}
version_schema: none
section: admin
priority: optional
maintainer: NYCU-SDC <https://github.com/NYCU-SDC/caravanserai>
homepage: https://github.com/NYCU-SDC/caravanserai
description: |-
  Caravanserai Node agent.
  Installed disabled: set SERVER_URL in /etc/cara/agent.env, put a join token
  in /etc/cara/join-token, then systemctl enable --now cara-agent.
contents:
  - src: bin/cara-agent
    dst: /usr/bin/cara-agent
    file_info: {mode: 0755}
  - src: packaging/systemd/cara-agent.service
    dst: /usr/lib/systemd/system/cara-agent.service
    file_info: {mode: 0644}
  - dst: /etc/cara
    type: dir
    file_info: {mode: 0700}
  - src: packaging/etc/agent.env
    dst: /etc/cara/agent.env
    type: config|noreplace
    file_info: {mode: 0600}
scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
  postremove: packaging/scripts/postrm.sh
