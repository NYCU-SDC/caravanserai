apiVersion: caravanserai/v1
kind: Project
metadata:
  name: wordpress
spec:
  services:
    - name: db
      image: mysql:8
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:            # apply examples/secret.yaml first
              name: wordpress-creds
              key: db-root-password
        - name: MYSQL_DATABASE
          value: "wp"
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
    - name: app
      image: wordpress:latest
      env:
        - name: WORDPRESS_DB_HOST
          value: db          # resolves via the shared bridge network
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-creds
              key: db-root-password
        - name: WORDPRESS_DB_NAME
          value: "wp"
  volumes:
    - name: mysql-data
      type: Ephemeral
  ingress:
    - name: web
      host: blog.example.com        # FQDN — used as-is
      target:
        service: app
        port: 80
      access:
        scope: Internal
    - name: admin
      host: admin                    # short name — resolved to admin.wordpress.local
      target:
        service: app
        port: 80
      access:
        scope: Internal
