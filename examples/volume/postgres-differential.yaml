# PostgreSQL whose Managed volume selects the PostgresDifferential backup
# strategy: pgBackRest full and differential backups with WAL archiving, taken
# while PostgreSQL keeps running.
#
# Not running yet. The Project is accepted and placed, but nothing backs it up:
# `caractl describe project pg-differential` shows BackupActive=False with
# reason StrategyNotActive, and the offline backup runner leaves this volume
# alone. A placement that would need this data from the object store is
# refused with StrategyRestoreUnavailable rather than started empty.
#
# The service must use the image below with the volume mounted at its PGDATA,
# every Managed volume of the Project must use this strategy, and backup.items
# cannot change once the Project exists.
apiVersion: caravanserai/v1
kind: Project
metadata:
  name: pg-differential
  namespace: default
spec:
  services:
    - name: db
      image: ghcr.io/nycu-sdc/cara-postgres:16
      env:
        - name: POSTGRES_PASSWORD
          value: demo
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data

  volumes:
    - name: pgdata
      type: Managed

  backup:
    interval: 24h
    items:
      - volume: pgdata
        strategy: PostgresDifferential
        retainFull: 4   # full backups kept, each with its differentials; 1 to 12
